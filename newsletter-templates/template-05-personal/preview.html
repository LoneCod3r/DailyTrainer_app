<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 Personal Letter — Newsletter preview</title>
<style>
  :root{--page:#fbf9f6;--surface:#fff;--ink:#1c1f1d;--muted:#6b716c;--line:#e7dccb;--brand:#436649;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:2;background:rgba(251,249,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .bar{max-width:1500px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;}
  .bar a{color:var(--brand);font-weight:600;text-decoration:none}
  .bar h1{margin:0;font:500 20px/1.2 Fraunces,Georgia,serif}
  .bar nav{margin-left:auto;display:flex;gap:14px;font-size:14px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
  main{max-width:1500px;margin:0 auto;padding:24px 16px 64px}
  h2{font:500 18px/1.3 Fraunces,Georgia,serif;margin:32px 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .frame{margin:0;max-width:100%}
  .frame figcaption{font-size:13px;color:var(--muted);margin-bottom:8px}
  .frame iframe{display:block;width:var(--w);max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 20px rgba(28,31,29,.06)}
</style>
</head>
<body>
<header><div class="bar">
  <a href="../index.html">&larr; All templates</a>
  <h1>05 · Personal Letter</h1>
  <span class="tag">Demo content</span>
  <nav><a href="index.html" target="_blank" rel="noopener">EN email ↗</a><a href="index.bg.html" target="_blank" rel="noopener">BG email ↗</a></nav>
</div></header>
<main>
  <h2>Desktop</h2>
  <div class="row">
      <figure class="frame" style="--w:700px">
        <figcaption>English</figcaption>
        <iframe src="index.html" title="English" width="700" height="1600" loading="lazy"></iframe>
      </figure>
      <figure class="frame" style="--w:700px">
        <figcaption>Български</figcaption>
        <iframe src="index.bg.html" title="Български" width="700" height="1600" loading="lazy"></iframe>
      </figure>
  </div>
  <h2>Mobile · 375px</h2>
  <div class="row">
      <figure class="frame" style="--w:375px">
        <figcaption>English</figcaption>
        <iframe src="index.html" title="English" width="375" height="1600" loading="lazy"></iframe>
      </figure>
      <figure class="frame" style="--w:375px">
        <figcaption>Български</figcaption>
        <iframe src="index.bg.html" title="Български" width="375" height="1600" loading="lazy"></iframe>
      </figure>
  </div>
</main>
<script>
  // Preview-only convenience (this page is not an email): size each frame to its
  // content when the browser allows reading it (http://); keeps 1600px otherwise.
  document.querySelectorAll('iframe').forEach(function (f) {
    f.addEventListener('load', function () {
      try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {}
    });
  });
</script>
</body>
</html>
