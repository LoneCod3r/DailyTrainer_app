name: Newsletter Templates (GitHub Pages)

# Publishes ONLY newsletter-templates/ as the GitHub Pages site. The rest of the
# repository (platform/, documents, videos, ...) is never part of the artifact.
on:
  push:
    branches: [main]
    paths:
      - 'newsletter-templates/**'
      - '.github/workflows/newsletter-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy newsletter templates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: newsletter-templates
          sparse-checkout-cone-mode: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload newsletter-templates/ as the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: newsletter-templates

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
