name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: platform

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community_platform_ci
  NEXTAUTH_SECRET: ci-smoke-test-secret-do-not-use-in-production
  NEXTAUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  DEFAULT_LANGUAGE: en
  DEFAULT_CURRENCY: EUR
  EMAIL_FROM: "KUKO WAY <no-reply@example.dev>"
  STORAGE_PROVIDER: local

jobs:
  smoke:
    name: Build, unit tests & full e2e suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      # Demo account password for the seed and the e2e login fixtures —
      # random per run, so no password is ever committed to this public repo.
      - name: Generate demo account password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "SEED_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Seed database
        run: npm run db:seed

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build the app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full e2e suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/playwright-report/
          retention-days: 7
